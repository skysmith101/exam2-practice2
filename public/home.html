<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-4">

        <h1>Order Management</h1>


        
        <!-- ADD ORDER FORM -->
        <!-- ========= -->

        <h3 class="mt-4">Add Order</h3>

        <form id="orderForm" class="mb-4">

            <div class="mb-2">
                <label>Description</label>

                <input
                    type="text"
                    id="orderDesc"
                    class="form-control"
                    required
                >
            </div>


            <div class="mb-2">
                <label>Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    class="form-control"
                    required
                >
            </div>


            <div class="mb-2">
                <label>Unit Cost</label>

                <input
                    type="number"
                    step="0.01"
                    id="unitCost"
                    class="form-control"
                    required
                >
            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Order
            </button>

        </form>



        
        <!-- ORDER TABLE -->
        <!-- ===== -->

        <h3>Orders</h3>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Description</th>
                    <th>Quantity</th>
                    <th>Unit Cost</th>
                    <th>Created</th>
                </tr>
            </thead>


            <!-- JavaScript puts rows here -->
            <tbody id="orderTableBody">
            </tbody>

        </table>

    </div>



    <script>

        
        // GET ALL ORDERS
        // =====

        async function loadOrders() {

            //change api if route different 
            const response = await fetch('/api/orders');

            const result = await response.json();



            const orders = result.data;


            // Must match:
            // <tbody id="orderTableBody">
            const tableBody =
                document.getElementById('orderTableBody');


            // clear old table rows
            tableBody.innerHTML = '';


            // loops
            orders.forEach(order => {

                // field names
                // if backend fields are different change of course
                tableBody.innerHTML += `
                    <tr>
                        <td>${order.orderID}</td>
                        <td>${order.orderDesc}</td>
                        <td>${order.quantity}</td>
                        <td>${order.unitCost}</td>
                        <td>${order.created}</td>
                    </tr>
                `;

            });

        }



      
        // POST / ADD NEW ORDER
        // ===============

        document
            .getElementById('orderForm')
            .addEventListener(
                'submit',
                async function(event) {

                    // Stops form refreshing
                    event.preventDefault();


                    // Get values from inputs
                    // Idsz must match HTML input IDs

                    const orderDesc =
                        document
                            .getElementById('orderDesc')
                            .value;

                    const quantity =
                        document
                            .getElementById('quantity')
                            .value;

                    const unitCost =
                        document
                            .getElementById('unitCost')
                            .value;


                    // Send new order backend
                    const response = await fetch(
                        '/api/orders',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            // CHANGE property names
                            // to match backend fields
                            body: JSON.stringify({
                                orderDesc: orderDesc,
                                quantity: quantity,
                                unitCost: unitCost
                            })
                        }
                    );


                    const result =
                        await response.json();


                    console.log(result);


                    // Clear form after submit
                    document
                        .getElementById('orderForm')
                        .reset();


                    // Reload table so new order appears
                    loadOrders();

                }
            );



        
        // LOAD TABLE WHEN PAGE OPEN
        loadOrders();


    </script>

</body>

</html>
