<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-4">

        <h1>Orders</h1>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Description</th>
                    <th>Quantity</th>
                    <th>Unit Cost</th>
                    <th>Created</th>
                </tr>
            </thead>

            <tbody id="orderTableBody">
            </tbody>

        </table>

    </div>


    <script>

        // GET ALL records from backend
        async function loadOrders() {

            // CHANGE API route if needed
            const response = await fetch('/api/orders');

            const result = await response.json();

            // API returns the records inside data
            const orders = result.data;

            // Find table body
            const tableBody =
                document.getElementById('orderTableBody');

            // Clear table
            tableBody.innerHTML = '';

            // Add one row for every record
            orders.forEach(order => {

                tableBody.innerHTML += `
                    <tr>
                        <td>${order.orderID}</td>
                        <td>${order.orderDesc}</td>
                        <td>${order.quantity}</td>
                        <td>${order.unitCost}</td>
                        <td>${order.created}</td>
                    </tr>
                `;

            });

        }

        loadOrders();

    </script>

</body>

</html>
